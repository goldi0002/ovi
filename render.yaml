# Render Blueprint: https://render.com/docs/blueprint-spec
# Connect it in the Render dashboard (New → Blueprint → this repo).
services:
  - type: web
    name: ovi
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    # Free plan: sleeps after ~15 minutes idle and has NO persistent disk, so the
    # SQLite database (/data/ovi.db) is wiped on every deploy, restart or sleep.
    # To keep data, switch to `plan: starter` and add:
    #   disk:
    #     name: ovi-data
    #     mountPath: /data
    #     sizeGB: 1
    plan: free
    branch: main
    # Deploy a new commit on main only after its GitHub checks (CI) pass.
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PORT
        value: "8080"
      # Render generates a random API key; copy it from the service's Environment tab.
      - key: Auth__ApiKey
        generateValue: true
      # Render's proxy is the only way in and appends the client IP to X-Forwarded-For.
      - key: ReverseProxy__TrustAllProxies
        value: "true"
      - key: DOTNET_gcServer
        value: "0"
      # Short URLs use RENDER_EXTERNAL_URL (set by Render) unless you set App__PublicBaseUrl,
      # e.g. to a custom domain.
