# Render Blueprint: https://render.com/docs/blueprint-spec
# Connect it in the Render dashboard (New → Blueprint → this repo).
services:
  - type: web
    name: ovi
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    # Free plan: sleeps after ~15 minutes idle. Data lives in Neon Postgres, so it survives.
    plan: free
    branch: main
    # Deploy a new commit on main only after its GitHub checks (CI) pass.
    autoDeployTrigger: checksPass
    healthCheckPath: /health/live
    numInstances: 1
    envVars:
      - key: PORT
        value: "8080"
      # Render generates a random API key; copy it from the service's Environment tab.
      - key: Auth__ApiKey
        generateValue: true
      # Render's proxy is the only way in and appends the client IP to X-Forwarded-For.
      - key: ReverseProxy__TrustAllProxies
        value: "true"
      # Ping our own public URL every 10 minutes so the free instance doesn't sleep after
      # 15 idle minutes. Uses about 744 of the workspace's 750 free instance hours a month.
      - key: KeepAlive__Enabled
        value: "true"
      - key: DOTNET_gcServer
        value: "0"
      # Neon Postgres. Render asks for these when the Blueprint is applied; copy them from
      # `neon env pull` (.env.local) or the Neon Console's Connect dialog.
      # Pooled (-pooler host) for app traffic:
      - key: DATABASE_URL
        sync: false
      # Direct host, used only to run migrations at startup:
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Sign-in. Create the OAuth apps as described in the README ("Sign-in with Google and GitHub"),
      # with callback URLs <site>/auth/callback/google and <site>/auth/callback/github.
      # A provider stays off until both of its values are set.
      - key: Auth__Google__ClientId
        sync: false
      - key: Auth__Google__ClientSecret
        sync: false
      - key: Auth__GitHub__ClientId
        sync: false
      - key: Auth__GitHub__ClientSecret
        sync: false
      # Google Safe Browsing key (see the README, "Abuse protection"). The check stays off until it's set.
      - key: SafeBrowsing__ApiKey
        sync: false
      # Comma-separated verified emails that get the Admin dashboard when signed in.
      - key: Auth__AdminEmails
        sync: false
      # Encrypt the sign-in key ring stored in the database: add a secret file in the Render dashboard and set
      # these to its path (e.g. /etc/secrets/dp.pfx) and password. Without them the keys are stored unencrypted.
      # - key: DataProtection__CertificatePath
      #   sync: false
      # - key: DataProtection__CertificatePassword
      #   sync: false
      # Short URLs use RENDER_EXTERNAL_URL (set by Render) unless you set App__PublicBaseUrl,
      # e.g. to a custom domain.
