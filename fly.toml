# Fly.io config. Deployed by the `deploy` job in .github/workflows/ci.yml.
# The app name is global on Fly.io: if it's taken, change `app` and App__PublicBaseUrl together.
app = "ovi-goldi0002"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  App__PublicBaseUrl = "https://ovi-goldi0002.fly.dev"
  ASPNETCORE_HTTP_PORTS = "8080"
  # Fly's proxy is the only way in, and it sets Fly-Client-IP to the real client address.
  ReverseProxy__TrustAllProxies = "true"
  ReverseProxy__ClientIpHeader = "Fly-Client-IP"
  # Workstation GC keeps memory low on a small machine.
  DOTNET_gcServer = "0"
  # Auth__ApiKey is a Fly secret, set by the deploy job from the OVI_API_KEY GitHub secret.

# SQLite lives on a persistent volume. One volume means one machine.
[mounts]
  source = "ovi_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
