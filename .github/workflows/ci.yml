name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build, test and check packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Check licenses and vulnerabilities
        run: python3 scripts/check-packages.py

      - name: Check EF migrations are up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Ovi.Api --no-build --configuration Release

  web:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check licenses and vulnerabilities
        run: |
          node ../scripts/check-npm-licenses.mjs package-lock.json
          npm audit --audit-level=high

  docker:
    name: Docker image
    needs: [test, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ env.PUSH != 'true' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # The cache is only a speed-up: if GitHub's cache service refuses the write
          # (e.g. "cache write denied: token has no writable scopes"), keep the build.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke test image
        if: env.PUSH != 'true'
        run: |
          set -euo pipefail
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker network create ovi-net
          docker run -d --name pg --network ovi-net -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=ovi postgres:17-alpine
          for i in $(seq 30); do docker exec pg pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name ovi --network ovi-net -p 8080:8080 \
            -e DATABASE_URL=postgresql://postgres:postgres@pg:5432/ovi \
            -e Auth__ApiKey=ci-key -e App__PublicBaseUrl=https://ovi.example "$image"
          for i in $(seq 30); do curl -fsS localhost:8080/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/links)" = 401
          code=$(curl -fsS -X POST localhost:8080/api/links -H 'X-Api-Key: ci-key' -H 'content-type: application/json' \
            -d '{"url":"https://example.com","customCode":"ci-smoke"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["shortUrl"])')
          test "$code" = "https://ovi.example/ci-smoke"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/ci-smoke)" = 302
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          asset=$(curl -fsS localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -n1)
          curl -fsS -o /dev/null "localhost:8080$asset"

      - name: Container logs
        if: failure()
        run: docker logs ovi || true
