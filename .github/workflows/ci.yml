name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Pushing a version tag (v1.2.3) publishes that release: semver image tags, `latest` and a GitHub Release.
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build, test and check packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Check licenses and vulnerabilities
        run: python3 scripts/check-packages.py

      - name: Test scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # A release can't go out without notes: fail before anything is built or published.
      - name: Check release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release-notes.py "${GITHUB_REF_NAME#v}"

      - name: Check EF migrations are up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Ovi.Api --no-build --configuration Release

  web:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check licenses and vulnerabilities
        run: |
          node ../scripts/check-npm-licenses.mjs package-lock.json
          node ../scripts/check-npm-audit.mjs

  # Builds the image for every change and smoke-tests it, but holds no push permission.
  docker:
    name: Docker image
    needs: [test, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,format=short

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # The cache is only a speed-up: if GitHub's cache service refuses the write
          # (e.g. "cache write denied: token has no writable scopes"), keep the build.
          cache-to: type=gha,mode=max,ignore-error=true

      # Runs the image the way self-hosters do: through docker-compose.yml, with .env.example filled in.
      - name: Smoke test image with docker compose
        run: |
          set -euo pipefail
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          sed -e 's|^OVI_PUBLIC_URL=.*|OVI_PUBLIC_URL=https://ovi.example|' \
              -e 's|^OVI_API_KEY=.*|OVI_API_KEY=ci-smoke-key-0123456789abcdefghij|' \
              -e 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci0smoke0password|' .env.example > .env
          echo "OVI_IMAGE=$image" >> .env
          docker compose up -d --wait --wait-timeout 120 db
          docker compose up -d ovi
          for i in $(seq 60); do curl -fsS localhost:8080/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/links)" = 401
          code=$(curl -fsS -X POST localhost:8080/api/links -H 'X-Api-Key: ci-smoke-key-0123456789abcdefghij' -H 'content-type: application/json' \
            -d '{"url":"https://example.com","customCode":"ci-smoke"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["shortUrl"])')
          test "$code" = "https://ovi.example/ci-smoke"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/ci-smoke)" = 302
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          asset=$(curl -fsS localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -n1)
          curl -fsS -o /dev/null "localhost:8080$asset"

          docker compose restart ovi
          for i in $(seq 60); do curl -fsS localhost:8080/health >/dev/null 2>&1 && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/ci-smoke)" = 302   # data kept across a restart
          if docker compose logs ovi 2>&1 | grep -E '\| +(fail|crit):|libgssapi'; then echo "Errors in the Ovi log"; exit 1; fi

      # Self-hosters run Ovi on ARM too (Raspberry Pi, ARM cloud servers). Build that image and run it, under
      # emulation, against the same database, so a change that breaks it fails here and not after publishing.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build for ARM64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ovi:ci-arm64
          cache-from: type=gha

      - name: Smoke test ARM64 image
        run: |
          set -euo pipefail
          OVI_IMAGE=ovi:ci-arm64 docker compose up -d ovi
          test "$(docker image inspect --format '{{.Architecture}}' ovi:ci-arm64)" = arm64
          test "$(docker compose ps --format '{{.Image}}' ovi)" = ovi:ci-arm64
          docker compose exec -T ovi uname -m | grep -qx aarch64
          for i in $(seq 120); do curl -fsS localhost:8080/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/ci-smoke)" = 302
          curl -fsS localhost:8080/ | grep -q '<div id="root">'

      - name: Container logs
        if: failure()
        run: docker compose logs || true

  # Pushes from main (`edge`) and from version tags (the release), only after the image passed its smoke tests,
  # and only this job can write packages.
  publish:
    name: Publish image
    needs: [test, web, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  release:
    name: GitHub Release
    needs: [publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release-notes.py "${GITHUB_REF_NAME#v}" > notes.md
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          # A release made on GitHub's Releases page (which also creates the tag) gets its title and notes here.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Ovi $GITHUB_REF_NAME" --notes-file notes.md "${prerelease[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Ovi $GITHUB_REF_NAME" --notes-file notes.md "${prerelease[@]}"
          fi
