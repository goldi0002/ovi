name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build, test and check packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Check licenses and vulnerabilities
        run: python3 scripts/check-packages.py

      - name: Check EF migrations are up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Ovi.Api --no-build --configuration Release

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ env.PUSH != 'true' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        if: env.PUSH != 'true'
        run: |
          set -euo pipefail
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name ovi -p 8080:8080 -e Auth__ApiKey=ci-key -e App__PublicBaseUrl=https://ovi.example "$image"
          for i in $(seq 30); do curl -fsS localhost:8080/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/links)" = 401
          code=$(curl -fsS -X POST localhost:8080/api/links -H 'X-Api-Key: ci-key' -H 'content-type: application/json' \
            -d '{"url":"https://example.com","customCode":"ci-smoke"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["shortUrl"])')
          test "$code" = "https://ovi.example/ci-smoke"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/ci-smoke)" = 302

      - name: Container logs
        if: failure()
        run: docker logs ovi || true

  deploy:
    name: Deploy to Fly.io
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://ovi-goldi0002.fly.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      OVI_API_KEY: ${{ secrets.OVI_API_KEY }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$FLY_API_TOKEN" ] || [ -z "$OVI_API_KEY" ]; then
            echo "::notice title=Deploy skipped::Add the FLY_API_TOKEN and OVI_API_KEY repository secrets to deploy to Fly.io (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.secrets.outputs.ready == 'true'

      - name: Create app and volume if missing
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          app=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          region=$(sed -n 's/^primary_region = "\(.*\)"/\1/p' fly.toml)
          if ! flyctl status --app "$app" >/dev/null 2>&1; then
            flyctl apps create "$app"
          fi
          if [ "$(flyctl volumes list --app "$app" --json | jq length)" = "0" ]; then
            flyctl volumes create ovi_data --app "$app" --region "$region" --size 1 --yes
          fi

      - name: Set API key secret
        if: steps.secrets.outputs.ready == 'true'
        run: echo "Auth__ApiKey=$OVI_API_KEY" | flyctl secrets import --stage

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: flyctl deploy --remote-only --ha=false

      - name: Check live health
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 30); do
            curl -fsS https://ovi-goldi0002.fly.dev/health && exit 0
            sleep 2
          done
          exit 1
